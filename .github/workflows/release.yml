name: Release

on:
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/huggingface/hf-csi-driver
  HELM_CHART: deploy/helm/hf-csi-driver

jobs:
  release:
    permissions:
      contents: write
    name: Create Github release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        id: release
        uses: huggingface/semver-release-action@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    permissions:
      contents: read
      packages: write
    name: Build & Push Docker
    runs-on: ubuntu-22.04
    needs: release
    if: needs.release.outputs.released == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds into the local image store, which is the only place the Wiz CLI reads,
      # scans, pushes only if the scan passes, then registers the pushed digest so
      # cluster admission recognises the image. Both tags share one manifest and one
      # digest, so the registration covers them together.
      - uses: huggingface/wiz-image-action/build-push@53a5b4af184193adf1773753f29b3f903445e31b # v1.3.0
        with:
          image: ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}
          extraTags: ${{ env.IMAGE }}:latest
          context: .
          clientId: ${{ vars.WIZ_CLI_CLIENT_ID }}
          clientSecret: ${{ secrets.WIZ_CLI_CLIENT_SECRET }}

  helm:
    permissions:
      contents: read
      packages: write
    name: Publish Helm Chart
    runs-on: ubuntu-22.04
    # Gate the chart publish on a successful image push: the chart pins
    # image.tag/webhook.image.tag to this release's tag, so publishing it before
    # (or despite) a failed Docker build would ship a chart referencing an image
    # that doesn't exist in the registry (ImagePullBackOff on deploy).
    needs: [release, docker]
    if: needs.release.outputs.released == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Fetch latest hf-mount release tag
        id: hfmount
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api /repos/huggingface/hf-mount/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Substitute placeholders
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          HFMOUNT_TAG: ${{ steps.hfmount.outputs.tag }}
        run: |
          sed -i "s/0.0.0-latest/${VERSION}/g" ${HELM_CHART}/Chart.yaml
          yq -i ".image.tag = \"${TAG}\"" ${HELM_CHART}/values.yaml
          yq -i ".webhook.image.tag = \"${TAG}\"" ${HELM_CHART}/values.yaml
          yq -i ".hfMount.image.tag = \"${HFMOUNT_TAG}\"" ${HELM_CHART}/values.yaml

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          helm package "${HELM_CHART}" --version "${VERSION}" --app-version "${VERSION}"
          helm push "hf-csi-driver-${VERSION}.tgz" "oci://${REGISTRY}/huggingface/charts"

image:
  repository: ghcr.io/huggingface/hf-csi-driver
  # Overwritten at release time by .github/workflows/release.yml
  tag: latest
  pullPolicy: IfNotPresent

hfMount:
  image:
    repository: ghcr.io/huggingface/hf-mount-fuse
    # Default for source installs; overwritten at release time with the latest
    # hf-mount release tag (see .github/workflows/release.yml). v0.8.0 floors the
    # SIGTERM shutdown grace so a too-low HF_CSI_TERMINATION_GRACE_SECONDS can no
    # longer exit the FUSE daemon while a mount is still busy and strand the pod
    # in an unkillable D-state (huggingface/hf-mount#202).
    tag: v0.8.0
    pullPolicy: IfNotPresent
  hostNetwork: true

logVerbosity: 4

cacheDir: /var/lib/hf-csi-driver/cache

updateStrategy:
  maxUnavailable: "100%"

hostNetwork: true

# hostPID is required by the orphaned-FUSE-connection sweep (fuseSweep) so the
# plugin can inspect node processes. Set both to false together to opt out.
hostPID: true

# Periodic sweep that aborts FUSE connections whose serving hf-mount daemon is
# gone (zombie/absent) — the recovery path for connections orphaned with no
# NodeUnpublishVolume in flight. Strictly scoped to this driver's mounts and
# only fires when no live daemon is serving the mount.
fuseSweep:
  enabled: true
  interval: 60s

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

priorityClassName: system-node-critical

# Sidecar injection webhook. Always deployed; volumes that want the
# pod-based mounter can opt out per-volume with mountMode: mountpod.
webhook:
  image:
    repository: ghcr.io/huggingface/hf-csi-driver
    # Overwritten at release time by .github/workflows/release.yml
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 9443

sidecars:
  nodeDriverRegistrar:
    image: public.ecr.aws/eks-distro/kubernetes-csi/node-driver-registrar:v2.13.0-eks-1-31-12
  livenessProbe:
    image: public.ecr.aws/eks-distro/kubernetes-csi/livenessprobe:v2.14.0-eks-1-31-12
